[project]
name = "in-a-year"
version = "0.1.0"
description = "Show your year in stats from Spotify, GitHub, Hardcover, Trakt and more"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.2.1",
    "celery[redis]>=5.4.0",
    "fastapi>=0.128.0",
    "greenlet>=3.3.1",
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs-material>=9.7.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
