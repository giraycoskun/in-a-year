services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inayear
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inayear-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inayear-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: rustfs/rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ROOT_USER: rustfs
      RUSTFS_ROOT_PASSWORD: rustfspass
    volumes:
      - rustfs_data:/data
    command: server /data --console-address ":9001"
    networks:
      - inayear-network

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: inayear
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/inayear
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
      TRAKT_API_URL: ${TRAKT_API_URL:-https://api.trakt.tv}
      TMDB_API_KEY: ${TMDB_API_KEY}
    volumes:
      - ./backend:/app/backend:ro
      - ./ml:/app/ml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inayear-network
    command: celery -A backend.worker.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: inayear
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/inayear
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
      TRAKT_API_URL: ${TRAKT_API_URL:-https://api.trakt.tv}
    volumes:
      - ./backend:/app/backend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inayear-network
    command: celery -A backend.worker.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  rustfs_data:

networks:
  inayear-network:
    driver: bridge
